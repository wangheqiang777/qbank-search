name: 构建安装包

# 手动点按钮触发（Actions 页面 → Run workflow），或打 v* tag 自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ---------- 先做静态检查，几十秒就能发现语法错误，不浪费 macOS 额度 ----------
  analyze:
    name: 代码检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  # ---------- iOS：云端 macOS 编译，产出未签名 ipa（含广播扩展目标） ----------
  ios:
    name: iOS (未签名 ipa)
    needs: analyze
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 设置桌面显示名与文件访问权限
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 搜答案" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 搜答案" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || true

      - name: 拉依赖
        run: flutter pub get

      - name: 编译（不签名，扩展目标随工程一起编）
        run: flutter build ios --release --no-codesign

      - name: 打包成 .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          # 确认扩展已被嵌入
          ls -d Payload/Runner.app/Plugins/*.appex || { echo "ERROR: 广播扩展(.appex)未嵌入 ipa，录屏搜题功能不可用"; exit 1; }
          zip -qry qbank-search.ipa Payload
          ls -lh qbank-search.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: qbank-search-ipa
          path: app/build/ios/iphoneos/qbank-search.ipa
          retention-days: 30

  # ---------- Android：免费无限额度，装上就永久有效 ----------
  android:
    name: Android (apk)
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 编译 apk（限流重试；编译/配置错立刻停，不浪费重试）
        run: |
          for i in 1 2 3 4 5; do
            echo "=== 第 $i 次尝试 flutter build apk ==="
            if flutter build apk --release > /tmp/apk_build.log 2>&1; then
              echo "BUILD_OK"
              exit 0
            fi
            echo "--- 失败，诊断错误类型 ---"
            if grep -qE "Unresolved reference|e: file://|What went wrong" /tmp/apk_build.log; then
              echo "检测到【编译/配置错误】(非限流)，不重试，打印尾部日志："
              tail -60 /tmp/apk_build.log
              exit 1
            fi
            echo "疑似 Maven Central/Gradle Plugin Portal 限流(429)，90 秒后重试..."
            sleep 90
          done
          echo "重试 5 次仍失败，最后日志："
          tail -60 /tmp/apk_build.log
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: qbank-search-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
